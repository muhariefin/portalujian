<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ujian Aman</title>
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5;
        }
        
        /* Iframe untuk Google Form dibuat memenuhi layar */
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
            display: block;
        }

        /* Desain Overlay Layar Kunci */
        #lock-screen {
            display: none; /* Sembunyikan secara default */
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            z-index: 9999; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        
        .box { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 8px; 
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            border: 1px solid #e5e5e5;
        }

        .box h2 {
            margin-top: 0;
            color: #000000;
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 4px solid #000000;
            padding-bottom: 10px;
            display: inline-block;
        }

        .box p {
            color: #555555;
            margin-bottom: 25px;
            line-height: 1.6;
            margin-top: 20px;
            font-size: 15px;
        }

        input { 
            padding: 12px; 
            width: calc(100% - 24px); 
            font-size: 16px; 
            border: 1px solid #cccccc;
            border-radius: 4px;
            background: #f9f9f9;
            color: #000000;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #000000;
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
        }

        button { 
            padding: 12px 24px; 
            width: 100%;
            cursor: pointer; 
            font-size: 16px; 
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #333333;
        }

        .error { 
            color: #d32f2f; 
            margin-top: 15px; 
            display: none; 
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- URL Google Form telah dimodifikasi dengan penambahan '?embedded=true' agar tampil sempurna -->
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc_dLKzzQIIB9n1uEGBpxY79SupsN7aTD0lC7jtSW3Nds0s0Q/viewform?embedded=true" title="Google Form Ujian">Memuat...</iframe>

    <div id="lock-screen">
        <div class="box">
            <h2>Ujian Terkunci!</h2>
            <p>Anda terdeteksi meninggalkan halaman ujian atau membuka aplikasi lain. Silakan panggil pengawas/guru untuk membuka kembali ujian Anda.</p>
            <input type="password" id="teacher-password" placeholder="Masukkan Password Pengawas">
            <button onclick="checkPassword()">Buka Ujian</button>
            <div id="error-msg" class="error">Password salah! Silakan coba lagi.</div>
        </div>
    </div>

    <script>
        // Password yang disimpan BUKAN teks asli, melainkan format Base64.
        // "MTIz" adalah bentuk Base64 dari "123".
        // Jika Anda ingin mengubah password, gunakan website seperti base64encode.org 
        // untuk mengenkripsi password baru Anda, lalu taruh hasilnya di sini.
        const ENCODED_PASSWORD = "MTIz"; 
        
        const lockScreen = document.getElementById("lock-screen");
        const errorMsg = document.getElementById("error-msg");
        let isLocked = false;

        // Mematikan Klik Kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Mematikan shortcut keyboard untuk Developer Tools (F12, Ctrl+Shift+I, Ctrl+U)
        document.onkeydown = function(e) {
            if(e.keyCode == 123) { return false; } // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } // Ctrl+Shift+C
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl+Shift+J
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl+U
        }

        // 1. Deteksi jika siswa beralih ke tab lain atau meminimalkan browser
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) triggerLock();
        });

        // 2. Deteksi jika siswa membuka aplikasi lain (jendela browser kehilangan fokus)
        window.addEventListener("blur", () => {
            if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
                return; 
            }
            triggerLock();
        });

        // 3. Beri peringatan jika siswa mencoba menutup atau mereload tab
        window.addEventListener("beforeunload", (event) => {
            event.preventDefault();
            event.returnValue = ""; 
        });

        // Fungsi untuk memunculkan layar kunci
        function triggerLock() {
            if (!isLocked) {
                isLocked = true;
                lockScreen.style.display = "flex";
            }
        }

        // Fungsi untuk mengecek input password dari guru
        function checkPassword() {
            const input = document.getElementById("teacher-password").value;
            
            // Mengubah inputan guru ke Base64, lalu mencocokkannya dengan password tersimpan
            if (btoa(input) === ENCODED_PASSWORD) {
                lockScreen.style.display = "none";
                document.getElementById("teacher-password").value = "";
                errorMsg.style.display = "none";
                isLocked = false;
            } else {
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
